name: Test Build (Debug)

on:
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        Write-Host "=== System Info ==="
        systeminfo | Select-Object OSName, OSVersion, OSBuildNumber
        
        Write-Host "`n=== CMake Version ==="
        cmake --version
        
        Write-Host "`n=== Available Compilers ==="
        if (Test-Path "C:\ProgramData\chocolatey\tools") {
          Get-ChildItem "C:\ProgramData\chocolatey\tools" -Filter *.exe | Select-Object Name
        }
        
        Write-Host "`n=== Chocolatey installed packages ==="
        choco list --local-only | Select-String openssl
        
        Write-Host "`n=== Visual Studio locations ==="
        $vsDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue
        if ($vsDirs) {
          $vsDirs | Select-Object FullName
        } else {
          Write-Host "No Visual Studio installation found"
        }
        
        Write-Host "`n=== Checking cl.exe ==="
        try {
          & where.exe cl.exe 2>&1 | Select-Object -First 3
        } catch {
          Write-Host "cl.exe not found in PATH"
        }
        
        Write-Host "`n=== Checking g++ ==="
        try {
          g++ --version 2>&1 | Select-Object -First 5
        } catch {
          Write-Host "g++ not found"
        }
        
        Write-Host "`n=== ProgramFiles directories with 'ssl' or 'open' ==="
        Get-ChildItem "$env:ProgramFiles" -Filter "*ssl*","*open*" -Directory -ErrorAction SilentlyContinue | Select-Object Name
        