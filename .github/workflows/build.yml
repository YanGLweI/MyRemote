name: Build MyRemote Control (Windows Only)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - '**/CMakeLists.txt'
      - '*.cmake'
      - '*.bat'
  pull_request:
    branches: [ main, master ]
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC developer environment
      uses: microsoft/setup-msbuild@v2
      
    - name: Install OpenSSL dependencies
      run: |
        scoop install openssl1.1
        
    - name: Install Protocol Buffers
      run: |
        scoop install protobuf
        
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$env:SCOOP_PATH/programs/openssl" `
          -DCMAKE_PREFIX_PATH="$env:ProgramFiles(x86)/OpenSSL-Win64"
          
    - name: Build Client
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\bin\Release\agent.exe") {
          Write-Host "Client built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\bin\Release\agent.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          throw "Agent executable not found!"
        }
      
    - name: Upload client artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
        compression-level: 9
        
  build-server:
    name: Build Server Control Center (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC developer environment
      uses: microsoft/setup-msbuild@v2
      
    - name: Install Qt 6.x for MSVC 2019
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.0'
        cached: true
        modules: 'qt5compat qtshadertools qtopenglwidgets'
        
    - name: Install OpenSSL dependencies
      run: |
        scoop install openssl1.1
        
    - name: Install Protocol Buffers
      run: |
        scoop install protobuf
        
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DBUILD_CLIENT=OFF `
          -DBUILD_SERVER=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="$env:SCOOP_PATH/programs/openssl" `
          -DCMAKE_PREFIX_PATH="${env:LOCALAPPDATA}\QtProjects\Qt\6.7.0\msvc2019_64" `
          -DPOROTBUF_PROTOC_EXECUTABLE="$env:SCOOP_PATH\apps\protobuf\current\protoc.exe"
          
    - name: Build Server
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\bin\Release\control_server.exe") {
          Write-Host "Server built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\bin\Release\control_server.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          throw "Control server executable not found!"
        }
        
    - name: Upload server artifact
      uses: actions/upload-artifact@v4
      with:
        name: control_server-windows-x64
        path: ${{github.workspace}}/build/bin/Release/control_server.exe
        retention-days: 30
        compression-level: 9
        
  verify-builds:
    name: Verify All Builds
    needs: [build-client, build-server]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: List downloaded files
      run: |
        echo "Downloaded artifacts:"
        find . -type f -name "*.exe" | head -20
        
    - name: Create summary
      run: |
        echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Client Artifact" >> $GITHUB_STEP_SUMMARY
        if [ -f "agent-windows-x64/agent.exe" ]; then
          echo "✅ agent.exe exists" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(du -h agent-windows-x64/agent.exe)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Server Artifact" >> $GITHUB_STEP_SUMMARY
        if [ -f "control_server-windows-x64/control_server.exe" ]; then
          echo "✅ control_server.exe exists" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(du -h control_server-windows-x64/control_server.exe)" >> $GITHUB_STEP_SUMMARY
        fi
