name: Build MyRemote Control

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - '**/CMakeLists.txt'
      - '*.cmake'
      - '*.bat'
  pull_request:
    branches: [ main, master ]

jobs:
  build-client:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC developer environment
      uses: microsoft/setup-msbuild@v2
      
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DBUILD_CLIENT=ON ^
          -DBUILD_SERVER=OFF ^
          -DCMAKE_BUILD_TYPE=Release
          
    - name: Build Client
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Upload client artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
        
  build-server:
    name: Build Server Control Center (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install Qt dependencies
      # Note: Qt installation typically requires pre-built cache or manual setup
      run: |
        echo "Qt needs to be installed separately. Using system Qt if available."
        
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build ^
          -G "Visual Studio 17 2022" ^
          -A x64 ^
          -DBUILD_CLIENT=OFF ^
          -DBUILD_SERVER=ON ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_PREFIX_PATH="C:/Program Files (x86)/Qt/6.x.x/msvc2019_64"
          
    - name: Build Server
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: Upload server artifact
      uses: actions/upload-artifact@v4
      with:
        name: control_server-windows-x64
        path: ${{github.workspace}}/build/bin/Release/control_server.exe
        retention-days: 30
        
  build-ubuntu-debian:
    name: Build for Linux (Ubuntu/Debian)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ \
          cmake \
          libboost-dev \
          libboost-system-dev \
          libboost-thread-dev \
          qtbase5-dev \
          qtx11extras5-dev \
          libqt5opengl5-dev \
          libqt5widgets5 \
          protobuf-compiler \
          libprotobuf-dev \
          libssl-dev \
          openssl \
          pkg-config
            
    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        cached: true
        
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$QT_INSTALL_PREFIX"
          
    - name: Build with Ninja
      run: ninja -C ${{github.workspace}}/build
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: myremote-linux-x64
        path: ${{github.workspace}}/build/bin/
        retention-days: 30
        
  build-clang:
    name: Build with Clang (Cross-platform test)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Clang and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-14 \
          cmake \
          libboost-all-dev \
          protobuf-compiler \
          libprotobuf-dev \
          libssl-dev \
          ninja-build
          
    - name: Configure CMake with Clang
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_C_COMPILER=clang-14 \
          -DCMAKE_CXX_COMPILER=clang++-14 \
          -DCMAKE_BUILD_TYPE=Release
          
    - name: Build
      run: |
        cd ${{github.workspace}}/build
        ninja
      
    - name: Upload clibin artifacts
      uses: actions/upload-artifact@v4
      with:
        name: myremote-clang-linux
        path: ${{github.workspace}}/build/bin/
        retention-days: 30

  deploy-release:
    name: Deploy release assets
    runs-on: ubuntu-22.04
    needs: [build-client, build-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archive
      run: |
        mkdir release-assets
        cp -r agent-windows-x64/*.exe release-assets/
        ls -la release-assets/
        
    - name: Upload release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release-assets/*/*
        tag_name: auto-build-${{ github.sha }}
        name: Automated build ${{ github.sha }}
        body: "Auto-generated build from workflow"
        draft: false
        prerelease: false
