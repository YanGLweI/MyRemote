name: Build MyRemote (Client)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  build:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        # Check if chocolatey is available
        $choco = Get-Command choco -ErrorAction SilentlyContinue
        if ($choco) {
          Write-Host "Chocolatey found, installing dependencies..."
          $env:ChocolateyInstall = "$env:ProgramData\chocolatey"
          choco install openssl -y --no-progress
          
          Write-Host "`n=== Checking OpenSSL Installation ==="
          # Chocolatey installs to various locations depending on version
          # Try multiple possible locations
          $possiblePaths = @(
            "C:\ProgramData\chocolatey\lib\openssl",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL",
            "C:\OpenSSL-Win64",
            "C:\tools\openssl",
            "C:\Chocolatey\lib\openssl"
          )
          
          $foundPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "✅ Found at: $path"
              $foundPath = $path
              break
            }
          }
          
          if ($foundPath) {
            # Show directory structure for debugging
            Write-Host "`n=== Directory Structure ==="
            Get-ChildItem $foundPath -Directory -ErrorAction SilentlyContinue | Select-Object Name, @{N='Size';E={$_.TotalLength}}
            
            # Look for include and lib directories
            $includeDir = Get-ChildItem -Path $foundPath -Filter "include" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            $libDir = Get-ChildItem -Path $foundPath -Filter "lib" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($includeDir) { Write-Host "Include dir: $($includeDir.FullName)" }
            if ($libDir) { Write-Host "Lib dir: $($libDir.FullName)" }
            
            # Export as environment variable for CMake
            $normalizedPath = $foundPath.Replace('\', '/')
            Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$normalizedPath"
            Write-Host "`n✅ Set GITHUB_ENV: OPENSSL_ROOT_DIR=$normalizedPath"
          } else {
            Write-Host "❌ OpenSSL not found in any standard location"
            Write-Host "`nAvailable directories in ProgramData:"
            Get-ChildItem "$env:ProgramData" -Filter "*ssl*","*openssl*" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Cannot find OpenSSL installation! Please check Chocolatey packages."
          }
        } else {
          Write-Host "⚠️ Chocolatey not available on this runner, skipping..."
        }
      shell: pwsh
      
    - name: Configure CMake with MinGW
      working-directory: ${{github.workspace}}
      run: |
        # Show available compilers
        cmake --version
        g++ --version
        
        # Use MinGW Makefiles generator
        cmake -S . -B build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build .
      
    - name: Verify output
      run: |
        $possiblePaths = @(
          "${{github.workspace}}\build\bin\Release\agent.exe",
          "${{github.workspace}}\build\bin\agent.exe"
        )
        
        $found = $false
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            Write-Host "✅ Client built successfully at: $path"
            $exe = Get-ChildItem $path
            Write-Host "File size: $($exe.Length / 1KB) KB"
            $found = $true
            break
          }
        }
        
        if (-not $found) {
          # Show build directories
          $buildDirs = Get-ChildItem "${{github.workspace}}\build" -Directory | Select-Object Name
          $binDirs = Get-ChildItem "${{github.workspace}}\build\bin" -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "Build root directories: $($buildDirs.Name -join ', ')"
          Write-Host "Bin subdirectories: $($binDirs.Name -join ', ')"
          throw "❌ Agent executable not found in any expected location!"
        }
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
