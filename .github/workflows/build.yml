name: Build MyRemote (Client)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  build:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install vcpkg dependencies
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: "ac0c48f631f44f5e9d1b6e18e6872c9e2ec2f60b"
        runVcpkgInstallArgs: "openssl:x64 protobuf:x64 boost:x64"
      
    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        # Check available compilers
        cmake --version
        g++ --version
        Write-Host "Checking for MSVC..."
        if (Test-Path "C:\Program Files\Microsoft Visual Studio\2022\*") {
          Write-Host "MSVC found!"
        } else {
          Write-Host "MSVC not found in standard location. Available tools:"
          Get-ChildItem "C:\Program Files" -Recurse -Filter "cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 3
        }
        
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}\.vcpkg\installed\scripts\buildsystems\vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF `
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build .
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\agent.exe") {
          Write-Host "✅ Client built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\agent.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          # Check bin directory for alternative location
          $buildDirs = Get-ChildItem "${{github.workspace}}\build" -Directory
          Write-Host "Build directories: $($buildDirs.Name -join ', ')"
          throw "❌ Agent executable not found!"
        }
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/agent.exe
        retention-days: 30
