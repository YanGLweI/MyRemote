name: Build MyRemote (Client)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  build:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        # Check if chocolatey is available
        $choco = Get-Command choco -ErrorAction SilentlyContinue
        if ($choco) {
          Write-Host "Chocolatey found, installing dependencies..."
          $env:ChocolateyInstall = "$env:ProgramData\chocolatey"
          choco install openssl -y --no-progress
          
          Write-Host "`n=== Searching for OpenSSL Installation ==="
          
          # Method 1: Search for openssl.h to find exact installation path
          Write-Host "Looking for openssl.h files..."
          $opensslHeader = Get-ChildItem "C:\" -Recurse -Filter "openssl.h" -ErrorAction SilentlyContinue | 
            Select-Object -First 1 FullName
            
          if ($opensslHeader) {
            # Extract root directory from header path
            # Path format: C:\SomePath\include\openssl\openssl.h
            $includeDir = Split-Path $opensslHeader.FullName -Parent
            $rootDir = Split-Path $includeDir -Parent
            $normalizedRoot = $rootDir.Replace('\', '/')
            
            Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$normalizedRoot"
            Write-Host "✅ Found openssl.h at: $($opensslHeader.FullName)"
            Write-Host "✅ Set OPENSSL_ROOT_DIR=$normalizedRoot"
          } else {
            # Fallback: try common installation paths
            Write-Host "openssl.h not found in standard locations, trying common paths..."
            
            $possiblePaths = @(
              "C:/ProgramData/chocolatey/lib/openssl",
              "C:/Program Files/OpenSSL",
              "C:/OpenSSL",
              "C:/OpenSSL-Win64",
              "C:/tools/openssl"
            )
            
            foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                # Check if this path contains OpenSSL components
                $hasInclude = Test-Path "$path/include"
                $hasLib = Test-Path "$path/lib"
                
                if ($hasInclude -or $hasLib) {
                  Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$path"
                  Write-Host "✅ Found at: $path"
                  break
                }
              }
            }
            
            if (-not $env:OPENSSL_ROOT_DIR) {
              Write-Host "❌ OpenSSL installation not found in any standard location"
              throw "Cannot locate OpenSSL installation. Please verify Chocolatey package was installed correctly."
            }
          }
          
          # Verify OPENSSL_ROOT_DIR is set
          Write-Host "`nVerifying OPENSSL_ROOT_DIR:"
          if ($env:OPENSSL_ROOT_DIR) {
            Write-Host "  Value: $env:OPENSSL_ROOT_DIR"
            Write-Host "  Exists: $(Test-Path $env:OPENSSL_ROOT_DIR)"
            
            # List subdirectories
            Get-ChildItem $env:OPENSSL_ROOT_DIR -Directory | 
              Select-Object Name, @{N='Count';E={$_.Files.Count + $_.Directories.Count}} | 
              Format-Table -AutoSize
          } else {
            Write-Host "ERROR: OPENSSL_ROOT_DIR is not set!"
            throw "Failed to configure OpenSSL environment variable"
          }
        } else {
          Write-Host "⚠️ Chocolatey not available on this runner, skipping..."
        }
      shell: pwsh
      
    - name: Configure CMake with MinGW
      working-directory: ${{github.workspace}}
      run: |
        # Show available compilers
        cmake --version
        g++ --version
        
        # Use MinGW Makefiles generator
        cmake -S . -B build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build .
      
    - name: Verify output
      run: |
        $possiblePaths = @(
          "${{github.workspace}}\build\bin\Release\agent.exe",
          "${{github.workspace}}\build\bin\agent.exe"
        )
        
        $found = $false
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            Write-Host "✅ Client built successfully at: $path"
            $exe = Get-ChildItem $path
            Write-Host "File size: $($exe.Length / 1KB) KB"
            $found = $true
            break
          }
        }
        
        if (-not $found) {
          # Show build directories
          $buildDirs = Get-ChildItem "${{github.workspace}}\build" -Directory | Select-Object Name
          $binDirs = Get-ChildItem "${{github.workspace}}\build\bin" -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "Build root directories: $($buildDirs.Name -join ', ')"
          Write-Host "Bin subdirectories: $($binDirs.Name -join ', ')"
          throw "❌ Agent executable not found in any expected location!"
        }
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
