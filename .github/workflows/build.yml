name: Build MyRemote Control (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC developer environment
      uses: microsoft/setup-msbuild@v2
      
    - name: Verify Visual Studio installation
      run: |
        # Look for all Visual Studio versions
        $vsDirs = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue
        if ($vsDirs) {
          Write-Host "✅ Found Visual Studio directories:"
          foreach ($vs in $vsDirs) {
            Write-Host "  - $($vs.Name)"
            # VS directories are named by major version ("18" = VS2022, "19" = VS2022+)
            if ($vs.Name -match "^[12][0-9]$") {
              Write-Host "✅ Visual Studio $vs found at: $($vs.FullName)"
              $env:VSINSTALLDIR = $vs.FullName
              break
            }
          }
          
          # If VS2022 not found but any VS exists, try to find suitable one
          if (-not $env:VSINSTALLDIR) {
            # Look for Common7 directory which indicates valid VS
            $common7 = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*\Common7" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($common7) {
              $parent = $common7.Parent
              Write-Host "✅ Using Visual Studio at: $($parent.FullName)"
              $env:VSINSTALLDIR = $parent.FullName
            } else {
              throw "❌ No suitable Visual Studio installation found!"
            }
          }
          
          # Verify MSBuild
          $msbuild = "$env:VSINSTALLDIR\Common7\Tools\MSBuild.exe"
          if (Test-Path $msbuild) {
            & $msbuild -property:PlatformToolset | Select-Object -First 1
            Write-Host "✅ MSBuild ready"
          } else {
            throw "❌ MSBuild not found at expected location!"
          }
        } else {
          Write-Host "No Visual Studio directories found under C:\Program Files\Microsoft Visual Studio"
          throw "❌ Visual Studio 2022 not found! GitHub Actions runner should have VS2022 pre-installed."
        }
      
    - name: Install dependencies with Chocolatey
      run: |
        choco install openssl --version 1.1.1w -y --no-progress
        choco install protoc -y --no-progress
        
    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Release
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\bin\Release\agent.exe") {
          Write-Host "✅ Client built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\bin\Release\agent.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          throw "❌ Agent executable not found!"
        }
      
    - name: Upload client artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
