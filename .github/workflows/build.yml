name: Build MyRemote (Client)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  build:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        # Check if chocolatey is available
        $choco = Get-Command choco -ErrorAction SilentlyContinue
        if ($choco) {
          Write-Host "Chocolatey found, installing dependencies..."
          $env:ChocolateyInstall = "$env:ProgramData\chocolatey"
          choco install openssl -y --no-progress
          
          Write-Host "=== Checking OpenSSL Installation ==="
          # Chocolatey installs to various locations depending on version
          # Try multiple possible locations
          $possiblePaths = @(
            "C:\ProgramData\chocolatey\lib\openssl",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL",
            "C:\OpenSSL-Win64",
            "C:\tools\openssl"
          )
          
          $foundPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "✅ Found at: $path"
              $foundPath = $path
              break
            }
          }
          
          if ($foundPath) {
            # Export as environment variable for CMake
            Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$($foundPath.Replace('\', '/'))"
            Write-Host "Set GITHUB_ENV: OPENSSL_ROOT_DIR=$($foundPath.Replace('\', '/'))"
          } else {
            Write-Host "❌ OpenSSL not found in any standard location"
            Write-Host "Available directories in ProgramData:"
            Get-ChildItem "$env:ProgramData" -Filter "*ssl*" -Directory | Select-Object Name
            throw "Cannot find OpenSSL installation!"
          }
        } else {
          Write-Host "⚠️ Chocolatey not available on this runner, skipping..."
        }
      shell: pwsh
      
    - name: Configure CMake with MinGW
      working-directory: ${{github.workspace}}
      run: |
        # Show available compilers
        cmake --version
        g++ --version
        
        # Use MinGW Makefiles generator
        cmake -S . -B build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build .
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\agent.exe") {
          Write-Host "✅ Client built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\agent.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          # Check bin directory for alternative location
          $buildDirs = Get-ChildItem "${{github.workspace}}\build" -Directory
          Write-Host "Build directories: $($buildDirs.Name -join ', ')"
          throw "❌ Agent executable not found!"
        }
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/agent.exe
        retention-days: 30
