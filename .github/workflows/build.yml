name: Build MyRemote (Client)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  build:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        # Check if chocolatey is available
        $choco = Get-Command choco -ErrorAction SilentlyContinue
        if ($choco) {
          Write-Host "Chocolatey found, installing dependencies..."
          $env:ChocolateyInstall = "$env:ProgramData\chocolatey"
          
          # List available OpenSSL packages
          Write-Host "`n=== Available OpenSSL Packages ==="
          $sslPackages = choco search openssl --exact --no-cache | Select-String "^openssl "
          if ($sslPackages) {
            $sslPackages | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "No exact match found, listing all openssl packages..."
            choco search openssl --no-cache | Select-Object -First 10 | ForEach-Object { Write-Host $_ }
          }
          
          # Try multiple approaches to get OpenSSL
          $openSslFound = $false
          
          # Approach 1: Try pre-installed OpenSSL in common locations first
          Write-Host "`n=== Checking for Pre-installed OpenSSL ==="
          $preInstalledPaths = @(
            "C:/OpenSSL-Light",
            "C:/msys64/ucrt64",  # MSYS2 might have it
            "C:/mingw64"         # MinGW might have bundled it
          )
          
          foreach ($path in $preInstalledPaths) {
            if (Test-Path "$path/include/openssl/openssl.h") {
              $normalized = $path.Replace('\', '/')
              Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$normalized"
              Write-Host "✅ Found pre-installed at: $normalized"
              $openSslFound = $true
              break
            }
          }
          
          # Approach 2: Download pre-built OpenSSL from official source
          if (-not $openSslFound) {
            Write-Host "`n=== Downloading Official OpenSSL Binaries ==="
            # Download latest stable OpenSSL Windows binary
            Invoke-WebRequest -Uri "https://github.com/alextho/win-openssl/releases/download/v1.1.1t/openssl-1.1.1t-win64.zip" \
                              -OutFile "$env:TEMP\openssl.zip" --TimeoutSec 30
            Expand-Archive "$env:TEMP\openssl.zip" -DestinationPath "$env:TEMP\openssl" -Force
            
            # Set path to extracted OpenSSL
            $opensslRoot = "C:/OpenSSL"
            if (Test-Path "$env:TEMP\openssl") {
              Move-Item "$env:TEMP\openssl" "$opensslRoot" -Force
            }
            
            $normalized = $opensslRoot.Replace('\', '/')
            Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$normalized"
            Write-Host "✅ Set OPENSSL_ROOT_DIR=$normalized"
            
            # Verify installation
            Write-Host "`n=== Verifying Installation ==="
            choco list --local-only | Select-String openssl | ForEach-Object { Write-Host $_ }
          }
          
          # If still not found, do comprehensive search
          if (-not $openSslFound) {
            Write-Host "`n=== Comprehensive Search for OpenSSL ==="
            
            # Method 1: Search for openssl.h to find exact installation path
            Write-Host "Looking for openssl.h files..."
            $opensslHeader = Get-ChildItem "C:\" -Recurse -Filter "openssl.h" -ErrorAction SilentlyContinue | 
              Select-Object -First 1 FullName
              
            if ($opensslHeader) {
              # Extract root directory from header path
              # Path format: C:\SomePath\include\openssl\openssl.h
              $includeDir = Split-Path $opensslHeader.FullName -Parent
              $rootDir = Split-Path $includeDir -Parent
              $normalizedRoot = $rootDir.Replace('\', '/')
              
              Add-Content $env:GITHUB_ENV "OPENSSL_ROOT_DIR=$normalizedRoot"
              Write-Host "✅ Found openssl.h at: $($opensslHeader.FullName)"
              Write-Host "✅ Set OPENSSL_ROOT_DIR=$normalizedRoot"
              $openSslFound = $true
            } else {
              Write-Host "❌ Could not find openssl.h file - this is unusual!"
              throw "OpenSSL installation appears incomplete or corrupted."
            }
          }
          
          # Final verification
          Write-Host "`n=== Final Verification ==="
          if ($env:OPENSSL_ROOT_DIR) {
            Write-Host "✓ OPENSSL_ROOT_DIR value: $($env:OPENSSL_ROOT_DIR)"
            Write-Host "✓ Path exists: $(Test-Path $env:OPENSSL_ROOT_DIR)"
            
            # Check for expected subdirectories
            $hasInclude = Test-Path "$env:OPENSSL_ROOT_DIR/include"
            $hasLib = Test-Path "$env:OPENSSL_ROOT_DIR/lib"
            $hasBin = Test-Path "$env:OPENSSL_ROOT_DIR/bin"
            
            Write-Host "✓ Has include dir: $hasInclude"
            Write-Host "✓ Has lib dir: $hasLib"
            Write-Host "✓ Has bin dir: $hasBin"
            
            if (-not ($hasInclude -or $hasLib)) {
              Write-Host "WARNING: Neither include nor lib directories found!"
              Write-Host "Listing actual contents:"
              Get-ChildItem $env:OPENSSL_ROOT_DIR | Select-Object Name, Length, Mode | Format-Table -AutoSize
            }
          } else {
            Write-Host "ERROR: OPENSSL_ROOT_DIR is not set!"
            throw "Failed to configure OpenSSL environment variable"
          }
        } else {
          Write-Host "⚠️ Chocolatey not available on this runner, skipping..."
        }
      shell: pwsh
      
    - name: Configure CMake with MinGW
      working-directory: ${{github.workspace}}
      run: |
        # Show available compilers
        cmake --version
        g++ --version
        
        # Use MinGW Makefiles generator
        cmake -S . -B build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: cmake --build .
      
    - name: Verify output
      run: |
        $possiblePaths = @(
          "${{github.workspace}}\build\bin\Release\agent.exe",
          "${{github.workspace}}\build\bin\agent.exe"
        )
        
        $found = $false
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            Write-Host "✅ Client built successfully at: $path"
            $exe = Get-ChildItem $path
            Write-Host "File size: $($exe.Length / 1KB) KB"
            $found = $true
            break
          }
        }
        
        if (-not $found) {
          # Show build directories
          $buildDirs = Get-ChildItem "${{github.workspace}}\build" -Directory | Select-Object Name
          $binDirs = Get-ChildItem "${{github.workspace}}\build\bin" -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "Build root directories: $($buildDirs.Name -join ', ')"
          Write-Host "Bin subdirectories: $($binDirs.Name -join ', ')"
          throw "❌ Agent executable not found in any expected location!"
        }
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
