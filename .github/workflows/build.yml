name: Build MyRemote Control (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client Agent (Windows x64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC developer environment
      uses: microsoft/setup-msbuild@v2
      
    - name: Install dependencies with Chocolatey
      run: |
        choco install openssl --version 1.1.1w -y --no-progress
        choco install protoc -y --no-progress
        
    - name: Configure CMake with MSVC
      working-directory: ${{github.workspace}}
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DBUILD_CLIENT=ON `
          -DBUILD_SERVER=OFF `
          -DCMAKE_BUILD_TYPE=Release `
          
    - name: Build Client
      working-directory: ${{github.workspace}}/build
      run: ninja
      
    - name: Verify output
      run: |
        if (Test-Path "${{github.workspace}}\build\bin\Release\agent.exe") {
          Write-Host "✅ Client built successfully!"
          $exe = Get-ChildItem "${{github.workspace}}\build\bin\Release\agent.exe"
          Write-Host "File size: $($exe.Length / 1KB) KB"
        } else {
          throw "❌ Agent executable not found!"
        }
      
    - name: Upload client artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-windows-x64
        path: ${{github.workspace}}/build/bin/Release/agent.exe
        retention-days: 30
